[project]
name = "aplit-grader"
version = "0.1.0"
description = "Add your description here"
authors = [
    { email = "lumanlanc0@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.121.0",
    "boto3>=1.43.70",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.2",
    "spacy>=3.8.15",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
]

[tool.ruff.lint]
# B008: Depends(...) in argument defaults is FastAPI's documented DI pattern, not
# the mutable-default-argument bug this rule targets elsewhere.
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits the real Anthropic API, skipped by default (deselect with -m 'not live' or select with -m live)",
]
addopts = "-m 'not live'"
